<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f0f"/>
      <stop offset="100%" style="stop-color:#1a1a2e"/>
    </linearGradient>
    <linearGradient id="light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
    <linearGradient id="dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="circle-clip">
      <circle cx="200" cy="200" r="150"/>
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="158" fill="none" stroke="#333" stroke-width="1.5" opacity="0.4"/>
  <circle cx="200" cy="200" r="152" fill="none" stroke="#555" stroke-width="0.5" opacity="0.3"/>

  <!-- Main circle background -->
  <circle cx="200" cy="200" r="150" fill="url(#bg)"/>

  <!-- Yin-Yang shape clipped to circle -->
  <g clip-path="url(#circle-clip)">
    <!-- Light half (right) -->
    <path d="M200,50 A150,150 0 0,1 200,350 A75,75 0 0,1 200,200 A75,75 0 0,0 200,50" fill="url(#light)" filter="url(#glow)"/>

    <!-- Dark half (left) -->
    <path d="M200,50 A150,150 0 0,0 200,350 A75,75 0 0,0 200,200 A75,75 0 0,1 200,50" fill="url(#dark)"/>

    <!-- Light dot in dark -->
    <circle cx="200" cy="125" r="18" fill="url(#light)" opacity="0.9"/>

    <!-- Dark dot in light -->
    <circle cx="200" cy="275" r="18" fill="url(#dark)" opacity="0.9"/>
  </g>

  <!-- Subtle inner ring -->
  <circle cx="200" cy="200" r="150" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.15"/>

  <!-- Text below -->
  <text x="200" y="385" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="300" letter-spacing="6" fill="#888">ELITEX</text>
</svg>
